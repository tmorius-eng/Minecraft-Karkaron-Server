# SÜLD punishments for GrimAC (installed by deploy.sh into plugins/GrimAC/punishments.yml when GrimAC is installed;
# docs/ANTICHEAT.md). Grim's own default only alerts and logs. Its setbacks (the rubber-band that undoes an
# impossible move, a hit that could not land, a block that could not be placed) already stop most cheats; these
# kicks remove a client that keeps cheating after the setbacks. No bans here: a ban is a staff decision.
#
# "VL:interval command" runs the command when the group's violation level reaches VL, then every `interval` more
# (0 = once). Violations decay after remove-violations-after seconds. SÜLD's own dashes, leaps, dodges and the sky
# skill-tree seat are forgiven by SÜLD (anticheat.grim in plugins/SULD/config.yml) before they count here.
#
# Thresholds are set high above what laggy honest players reach: a flying or speeding client gains about 20
# Simulation VL a second, an honest player on a bad connection a few in five minutes.

Punishments:
  Simulation:
    # Fly, Speed, BunnyHop, Strafe, NoFall, Jesus, Step, Spider, HighJump, LongJump, Glide, Timer, Blink bursts
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "100:40 [alert]"
      - "1:1 [log]"
      - "250:0 kick %player% SÜLD анти-чийт: боломжгүй хөдөлгөөн (Fly/Speed/Timer). Алдаа бол админд хандана уу."
  Knockback:
    # Velocity / AntiKnockback / NoPush
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "40:0 kick %player% SÜLD анти-чийт: түлхэлт хүлээж авахгүй байна (Velocity)."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "60:0 kick %player% SÜLD анти-чийт: пакетын дараалал буруу."
  BadPackets:
    # Disabler, NoRotate, Derp, packet exploits, crashers (Crash checks also kick on their own)
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "50:0 kick %player% SÜLD анти-чийт: хууль бус пакет."
  Reach:
    # Reach, TpAura, ClickTP hits (impossible hits are blocked from the first one: block-impossible-hits)
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "20:0 kick %player% SÜLD анти-чийт: хэт холоос цохилт (Reach)."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "25:0 kick %player% SÜLD анти-чийт: хиймэл hitbox."
  Misc:
    # Boat/Elytra fly, NoSlow, Scaffold and AirPlace (Place), Nuker and FastBreak (Break), InventoryMove (MultiActions),
    # Baritone, Spammer (Chat), BookBot and anvil exploits (Exploit)
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "80:0 kick %player% SÜLD анти-чийт: зөвшөөрөгдөөгүй үйлдэл."
  Combat:
    # KillAura, Aimbot, AimAssist, TriggerBot snaps (Aim), MultiAura (Interact)
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
      - "80:0 kick %player% SÜLD анти-чийт: автомат онилгоо (KillAura/Aim)."
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
