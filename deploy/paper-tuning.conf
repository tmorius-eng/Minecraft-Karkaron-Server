# SÜLD production tuning for Paper 1.21.11, applied by deploy.sh after Paper generated its files
# (deploy/tools/paper_tune.py --profile). Every line is measured in docs/perf/WORLD_50.md; a key the installed Paper
# does not have fails the deploy instead of being ignored.

# Natural (vanilla) spawning. SÜLD's region spawner keeps the themed mobs around every player; the vanilla cap only
# stops piling up 70+ night monsters per player out of sight, and spawn attempts every 10 ticks instead of every tick
# refill the same cap more slowly. Bats are capped hard: they have no gameplay here and cost AI ticks underground.
config/paper-world-defaults.yml: entities.spawning.spawn-limits.ambient=4
config/paper-world-defaults.yml: entities.spawning.spawn-limits.water_ambient=8
config/paper-world-defaults.yml: entities.spawning.ticks-per-spawn.monster=10
config/paper-world-defaults.yml: entities.spawning.ticks-per-spawn.ambient=400
config/paper-world-defaults.yml: entities.spawning.ticks-per-spawn.water_ambient=400

# Chunk generation pressure: one player in fresh terrain (a teleport, a fast horse) may generate at most 40 chunks/s;
# the nearest chunks come first, so a fresh area is complete in seconds without starving the other 49 players.
config/paper-global.yml: chunk-loading-basic.player-max-chunk-generate-rate=40.0

# Entity density (measured F50 vs G50, docs/perf/WORLD_50.md: mean tick −24 %, p95 −25 %, worst tick 0.9 s): vanilla
# hostiles are the main-thread cost, and SÜLD's region spawner already keeps 4 themed mobs around every player.
config/paper-world-defaults.yml: entities.spawning.spawn-limits.monster=30
# M3 (docs/perf/M3_2026-10-12.md): at 25 bots the entity list was led by squid, glow squid, chickens, sheep, cows,
# nautilus and axolotls (vanilla passive caps, per player); SÜLD's world is a steppe, those are scenery. Lower caps.
config/paper-world-defaults.yml: entities.spawning.spawn-limits.creature=6
config/paper-world-defaults.yml: entities.spawning.spawn-limits.water_creature=2
config/paper-world-defaults.yml: entities.spawning.spawn-limits.underground_water_creature=2
config/paper-world-defaults.yml: entities.spawning.spawn-limits.axolotls=1
config/paper-world-defaults.yml: entities.spawning.despawn-ranges.monster.hard=72
config/paper-world-defaults.yml: entities.spawning.despawn-ranges.monster.soft=30
spigot.yml: world-settings.default.merge-radius.item=2.0

# Entity activation (spigot): mobs farther than this from every player tick only now and then (Spigot's activation
# range). 24 blocks for monsters keeps every fight around a player fully active (SÜLD's region spawner places its
# mobs within that range) while the vanilla crowd farther out costs less; animals 24. Villagers do not tick while
# inactive (Kharkhorum's NPCs are SÜLD Mannequins, not villagers). To be confirmed by the next 50-bot benchmark.
spigot.yml: world-settings.default.entity-activation-range.monsters=24
spigot.yml: world-settings.default.entity-activation-range.animals=24
spigot.yml: world-settings.default.entity-activation-range.tick-inactive-villagers=false
# Entity tracking (spigot): how far an entity's packets travel to players. With view distance 6 (96 blocks) nothing
# beyond 72 blocks is on a player's screen in a useful way; SÜLD's rigs freeze beyond 48 blocks (ModelInstance) and a
# steppe mob's displays are drawn only within 64 (M3, docs/perf/M3_2026-10-12.md). Fewer tracked entities per player
# = fewer entity packets and less tracker work per tick at 25–50 players.
spigot.yml: world-settings.default.entity-tracking-range.display=72
spigot.yml: world-settings.default.entity-tracking-range.monsters=72
spigot.yml: world-settings.default.entity-tracking-range.animals=64
spigot.yml: world-settings.default.entity-tracking-range.misc=48
# Anti-xray (audit P1; docs/ANTICHEAT.md): engine mode 2 sends fake ores everywhere below max-block-height until a
# player is next to the real block, so X-Ray, BlockESP, StorageESP, CaveFinder and Freecam in the cheat clients see
# noise. The hidden list is Paper's default plus every container and the spawner (StorageESP/BaseFinder targets).
config/paper-world-defaults.yml: anticheat.anti-xray.enabled=true
config/paper-world-defaults.yml: anticheat.anti-xray.engine-mode=2
config/paper-world-defaults.yml: anticheat.anti-xray.hidden-blocks=[copper_ore, deepslate_copper_ore, raw_copper_block, gold_ore, deepslate_gold_ore, iron_ore, deepslate_iron_ore, raw_iron_block, coal_ore, deepslate_coal_ore, lapis_ore, deepslate_lapis_ore, mossy_cobblestone, obsidian, chest, trapped_chest, barrel, ender_chest, spawner, diamond_ore, deepslate_diamond_ore, redstone_ore, deepslate_redstone_ore, clay, emerald_ore, deepslate_emerald_ore]
