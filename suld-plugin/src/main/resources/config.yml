# ============================================================================
#  SULD — Mongolian Hardcore MMORPG  |  core configuration
#  Every gameplay value is data-driven. Edit here, then restart the server (OPS-003). Content files: check them with
#  /suld content validate, then restart. Live reloads exist only for the resource pack (/suldpack reload) and items
#  (/itemsadmin reload).
# ============================================================================

# UI/message locale. "mn" = Mongolian (Cyrillic), "en" = English fallback.
# Schema version of this file (SULD migrates older files on start; do not edit).
config-version: 9
locale: mn

# ---------------------------------------------------------------------------
# Character progression (level / EXP curve).
# EXP to go from level L to L+1 = round(base * L^exponent).
# Progression v2 (docs/PROGRESSION_BALANCE_SPEC.md): 242 * L^2.2 since Act II (42 story chapters), about 200 active
# hours to level 60 (tuned by the simulation; Act I alone used 190; the full design with the world boss uses 315).
# legacy-curve: the curve stored bars were earned on before v2; a profile still on it is rescaled once on its next
# load (level kept, the same fraction of the bar).
# ---------------------------------------------------------------------------
progression:
  max-level: 60
  curve:
    base: 242.0
    exponent: 2.2
  legacy-curve:
    base: 100.0
    exponent: 1.75

# ---------------------------------------------------------------------------
# Persistence. type: h2 | memory | mysql | postgresql
#   h2           -> embedded file database in plugins/SULD/data/ (persistent, nothing to install; default)
#   memory       -> no database, data is LOST on every restart (automated tests only)
#   mysql        -> requires a reachable MySQL/MariaDB server
#   postgresql   -> requires a reachable PostgreSQL server
# ---------------------------------------------------------------------------
database:
  type: h2
  host: 127.0.0.1
  port: 3306
  database: suld
  username: suld
  password: ''
  pool-size: 10
  connection-timeout-ms: 10000
  use-ssl: false

# ---------------------------------------------------------------------------
# Hardcore PvE death system (docs/DEATH_AND_RECOVERY.md). No real-money mechanics: recovery is the real-time lock
# running out, or an admin action (/deathrevive). All harshness levers are here.
#   A death locks the player out of normal play (a soul: no fighting, looting, trading, building) for a real-world
#   time that grows with level — persisted, it survives restarts. After it ends, the class gear carries a wound
#   (−per-death effective stats, at most −max) that heals with active play.
# ---------------------------------------------------------------------------
death:
  enabled: true
  # Reform of 2026-10-13 (docs/DEATH_AND_RECOVERY.md): no passive waiting. Up to beginner-levels a death costs nothing
  # (no soul, EXP, items, wear or wound). From there the player is a soul until it comes back by acting:
  # «Тэнгэрийн сорил» (/trial, three spirit wolves, retry at once) or the ovoo ritual (three sunwise rounds, at least
  # ritual-seconds), or staff (/deathrevive). The Сүнсний Гэрэлт stands beacon.minutes where the player fell; walking
  # back to it as a soul gives back beacon.refund of the lost EXP, once.
  beginner-levels: 10
  ritual-seconds: 90
  beacon:
    minutes: 10
    refund: 0.70
  soul-state-seconds: 30        # minimum soul time with lock.mode TIMED (also the floor of the lock)
  exp-loss-fraction: 0.10       # of the progress into the current level (never a level)
  durability-damage-fraction: 0.25
  drop-loot: true
  loot-loss-fraction: 0.25      # of the droppable (non-soulbound) stacks
  allow-free-revive: true       # false = the lock only ends by /deathrevive
  lock:
    mode: UNTIL_RECOVERY        # UNTIL_RECOVERY: no timer (trial, ritual or staff) | TIMED: the curve below (before 2026-10-13)
    curve: GEOMETRIC            # TIMED only: GEOMETRIC | LINEAR | STEP | FIXED
    min-minutes: 5              # level 1   (geometric: 5 min · 6^((L−1)/59) → 9 min @20, 17 min @40, 30 min @60)
    max-minutes: 30             # level 60 and Ascension (was 1440 = 24 h; external audit FIND-05). /trial ends a lock sooner
    newbie-levels: 5            # up to this level the lock is at most newbie-minutes (0 = off)
    newbie-minutes: 1           # a level 1–5 death costs one minute, not five
  wound:
    per-death: 0.05
    max: 0.15
    heal-minutes: 180           # active minutes per healed step

# ---------------------------------------------------------------------------
# «Дайчдын Дасгалын Талбай» (docs/TRAINING_GROUNDS.md): any player — even before choosing a class — tries any class at
# level 60 with its top gear on the training Wardens (∞ health, never move, never despawn) and sees every hit, spell
# and passive explained. The character is a stand-in that is never saved; leaving gives everything back.
#   world/x/y/z: the yard's centre, the big Warden's block (the owner's spot of 2026-10-13, the middle of the walled
#   field); staff move it with /dasgal yard set (the centre where they stand)
#   blocks: only placed by staff, /dasgal yard build (undo: /dasgal yard undo) — the city is built by hand
# ---------------------------------------------------------------------------
training:
  enabled: true
  world: ""                     # empty = the main world
  x: -30
  y: 69
  z: -79

# ---------------------------------------------------------------------------
# Analytics. sink: log | database  (database requires a configured DB above)
# ---------------------------------------------------------------------------
analytics:
  enabled: true
  flush-interval-seconds: 30
  sink: log                  # database: batched rows in suld_analytics_events + one suld_sessions row per session
  retention-days: 90         # database sink: rows older than this are purged daily (0 = keep forever)
  skip-types: [exp_gain]     # high-volume types not stored (the session totals carry them)
  queue-limit: 10000         # most events buffered between flushes; beyond it the oldest are dropped

# ---------------------------------------------------------------------------
# Resource pack (custom HUD, item skins). Sent automatically on join.
#   url empty  -> SÜLD serves the pack bundled in its own jar (self-host below);
#                 players download it from http://<the host they joined with>:<port>/
#   url set    -> that externally hosted ZIP is sent instead (deploy/build-pack.sh prints url + sha1)
# The self-host port must be reachable by players (deploy/firewall.sh opens PACK_PORT).
# ---------------------------------------------------------------------------
resource-pack:
  enabled: true
  url: ''
  sha1: ''
  # The SÜLD UI (badges, menu art, icons, weapon skins) lives in the pack, so it is required by default.
  required: true
  prompt: 'SÜLD-д дүрс багц заавал хэрэгтэй: цэс, тэмдэг, зэвсгийн дүрс. Нэг удаа татна (~7 MB). (Required: the SÜLD resource pack)'
  self-host:
    enabled: true
    bind: 0.0.0.0
    port: 8164
    # e.g. http://play.example.mn:8164 when players join through a proxy or a different hostname
    public-url: ''

# ---------------------------------------------------------------------------
# Clans (овог). Founding costs in-game coins (a currency sink, never real money).
# ---------------------------------------------------------------------------
clans:
  create-cost: 500

# ---------------------------------------------------------------------------
# World events: server-wide timed objectives (e.g. Чонын Довтолгоо, the wolf
# raid). Admins can always force one with /suldevent start.
# ---------------------------------------------------------------------------
world-events:
  enabled: true
  interval-minutes: 45
  min-players: 1

# ---------------------------------------------------------------------------
# World bosses (docs/WORLD_BOSSES.md): a WORLD_BOSS mob rises at a historic site at each of these weekly hours
# ("<WEEKDAY> HH:mm" in daily.timezone); the bosses of content/events.json "worldBosses" take turns. The server is
# told announce-minutes before, and once more a minute before. Its health grows with the crowd (2–20 fighters).
# Admins: /suldevent boss [id] | boss stop.
# ---------------------------------------------------------------------------
worldboss:
  enabled: true
  times: ["WEDNESDAY 21:00", "SATURDAY 17:00"]
  announce-minutes: 10

# ---------------------------------------------------------------------------
# Их Хуралдай (docs/KHURALDAI.md): once a week the server votes on next week's campaign. Times are "<WEEKDAY> HH:mm"
# in daily.timezone. The vote held in a week elects the campaign of the next week. min-account-days keeps fresh alt
# accounts out of the ballot; min-voters is the quorum, below it the rotation decides.
# ---------------------------------------------------------------------------
khuraldai:
  enabled: true
  vote-opens: "SATURDAY 20:00"
  vote-closes: "SUNDAY 20:00"
  min-level: 5
  min-account-days: 1
  options: 3
  min-voters: 3

# The week's campaign (content/campaigns.json): the shared goal, personal tiers, a world effect on success.
# flush-seconds: how often buffered contributions reach the database (a crash loses at most this much progress).
# reward-claim-days: an offline player claims an owed tier reward on login within this many days (0 = online only).
# effect-cycles: how many later weeks a world effect stays (0 = permanent).
campaign:
  enabled: true
  starts: "MONDAY 00:00"
  ends: "SATURDAY 20:00"
  flush-seconds: 10
  reward-claim-days: 7
  effect-cycles: 1

# Баатрын Хроник: firsts, records and campaign results. broadcast: every new line is announced to everyone.
chronicle:
  enabled: true
  broadcast: true
  hall-entries: 12
  # Two boards on the plaza (entities, never blocks): the Хуралдай notice board and the Hall of Fame (newest lines).
  hall-boards: true
  hall-anchor: "event.plaza"   # a city point (assets/world/kharkhorum/points.json); boards stand 6 blocks to either side

# ---------------------------------------------------------------------------
# PvP policy (owner decision 2026-10-11): SÜLD is a hardcore PvE game. A player hurts another player only when both
# agreed: an accepted /duel (outside Kharkhorum, for duel-minutes) or a declared fighting ground. A relic is seized
# only in such a fight; any other death returns it to its shrine. wild-enabled: true restores the old open steppe.
# arenas: "world x1 z1 x2 z2" rectangles (block coordinates) where everyone may fight everyone.
# ---------------------------------------------------------------------------
pvp:
  wild-enabled: false
  duel-enabled: true
  duel-request-seconds: 60
  duel-minutes: 10
  arenas: []

# ---------------------------------------------------------------------------
# Authentication. SÜLD has NO /register or /login and never sees a password:
# identity comes only from Minecraft/Microsoft authentication (online-mode=true,
# or a Velocity proxy with modern forwarding). Players are identified by UUID.
# If the server is not verifying accounts, SÜLD refuses every login (fail closed).
# See docs/AUTHENTICATION.md.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Branding shown in the TAB list, sidebar and menus.
#   store-url: your web store (e.g. Tebex). The store delivers purchases by running
#   "credits give {uuid} <amount>" from the console. Credits buy cosmetics ONLY
#   (Minecraft EULA: no gameplay advantage for money).
# ---------------------------------------------------------------------------
# Chat protection: rate limit, repeated messages, other servers' addresses/IPs (allowed-domains pass; empty =
# branding.domain) and SHOUTING (lowered). Staff with suld.chat.bypass are not limited.
# SÜLD chat channels (docs/CHAT.md): /chat screen, /ch, /g /l /pc /tr /cc. heads: the speaker's head in front of every line.
chat:
  heads: true

# 3D models (docs/models/MOB_RIGS.md): every SÜLD mob and boss is drawn by a Display-Entity rig. mobs: false keeps
# only the bosses rigged (fewer entities on a weak server); the renderer's LOD already freezes rigs nobody is near.
models:
  mobs: true
  # A rigged mob's real (invisible) host takes the rig's drawn scale, so hits land where the model is (and GrimAC
  # sizes the hitbox the same way). Capped here: bigger hosts need more room to walk (corridors, caves, trees).
  host-scale-max: 1.6

# City NPCs talk first (a dialog with their trade and what they know); Shift + right-click skips (docs/NPC_DIALOGUE.md).
npc:
  dialogue: true

# Dungeon halls (docs/world/DUNGEON_HALLS.md): build one hall per theme shortly after start, one at a time.
dungeons:
  prewarm-halls: true

chat-guard:
  enabled: true
  max-messages: 4
  window-seconds: 5
  repeat-seconds: 30
  block-links: true
  allowed-domains: []
  caps-limit: 0.7

# On first start SÜLD creates the LuckPerms groups (default, helper, mod, admin, developer, streamer, sponsor) with the
# permissions listed in resources/permissions/luckperms.txt, once (marker: plugins/SULD/.permissions-applied).
# Delete the marker to apply again; set false to manage LuckPerms yourself.
permissions:
  auto-setup: true

# Floating guide boards in front of the arrival point (how to play, how to earn coins, commands).
guide:
  boards: true

# Rotating chat tips: one line every interval-minutes (0 = off). messages: MiniMessage lines, empty = built-in tips.
tips:
  interval-minutes: 6
  messages: []

# Daily login reward (/daily): one claim per calendar day in this time zone.
daily:
  timezone: Asia/Ulaanbaatar

branding:
  domain: suld.mn
  # Server-list MOTD: two MiniMessage lines (empty = the built-in SÜLD lines).
  motd: []
  # Show the bundled SÜLD icon in the server list (ignored when the server folder has its own server-icon.png).
  server-icon: true
  discord: ''
  store-url: ''
  # /vote link (a server-list page); /discord uses discord above, /website the domain.
  vote-url: ''

store:
  packages:
    - {credits: 100, price: '₮5,000'}
    - {credits: 250, price: '₮11,000'}
    - {credits: 600, price: '₮25,000'}
    - {credits: 1300, price: '₮50,000'}
    - {credits: 2800, price: '₮100,000'}

ui:
  # Show the welcome screen (tutorial / menu / play) when a returning player joins.
  welcome-screen: true

# Server owners: always operator (OP re-granted on every join). Only on a VERIFIED login
# (online-mode=true or Velocity modern forwarding); the account UUID is pinned in
# plugins/SULD/owners.yml on the owner's first verified join, so a later holder of the
# same name never gets OP. Entries are Minecraft names or account UUIDs. Ships EMPTY
# (SEC-002): put your own account here. Removing a name also drops its pin on the next
# start (SEC-001); the OP the player already holds is removed with /deop or op.sh --deop.
owners: []

auth:
  # LOCAL DEVELOPMENT ONLY — lets an offline-mode test server accept logins.
  # Anyone could join as anyone. NEVER enable on a public server.
  allow-insecure-offline-dev-mode: false
  profile-load-timeout-seconds: 10
  pending-session-ttl-seconds: 60

# ---------------------------------------------------------------------------
# World-unique relics (Хөх Сүлд, ...). Each exists ONCE on the whole server;
# the database is the only truth about who bears it. Shrines without a set
# location are built automatically on the surface at a random distance from
# spawn (admins can move them: /relic setshrine <key>).
# ---------------------------------------------------------------------------
relics:
  enabled: true
  auto-place-min-radius: 600
  auto-place-max-radius: 1200
  offline-return-hours: 72
  ritual-seconds: 10
  hint-cooldown-seconds: 300

# ---------------------------------------------------------------------------
# World: Kharkhorum spawn city. With kharkhorum-auto-build the WorldBuilder builds
# slice 1 once on first boot at the world spawn (resumable across restarts; state,
# height map and rollback log in plugins/SULD/worldbuild/) and moves the spawn onto
# the plaza. Operate it with /worldbuild (status, validate, rollback confirm, ...).
# build-blocks-per-tick caps writes per tick (a 25 ms time budget applies too).
# region-spawning / region-mobs-per-player: SÜLD mobs kept around every player out in the wild (more at night).
# ---------------------------------------------------------------------------
world:
  kharkhorum-auto-build: true
  # true: on every start the built city is put back exactly as planned (/worldbuild repair). That also undoes
  # what staff build by hand in the city (/worldbuild edit), so it is off while the spawn is built by hand.
  kharkhorum-auto-repair: false
  build-blocks-per-tick: 4000
  region-spawning: true
  region-mobs-per-player: 4
  # false (default): zombies, skeletons, creepers… do not spawn naturally in the overworld; each region's own SÜLD
  # mobs are the monsters, day and night (more of them at night). true: vanilla night monsters as well.
  vanilla-hostiles: false
  # The playable overworld: Minecraft's own world border, set once and kept in level.dat (docs/world/WORLD_BORDER.md).
  # centre: "spawn" (Kharkhorum's plaza; every region ring is measured from it) or fixed "x z".
  border:
    enabled: true
    center: spawn
    diameter: 10000             # 10 000 x 10 000 blocks, radius 5 000
    warning-distance: 24
    damage-buffer: 4
    damage-per-block: 0.5
  # SÜLD's throttled pre-generator (docs/world/PREGENERATION.md): only the places players are sent to are generated
  # ahead; the wilderness generates as it is explored. P0 spawn+Kharkhorum, P1 routes to the inner areas, P2 shrines
  # and dungeon grounds, P3 the heart of every area, P4 routes to the outer areas, P5 everything (/suldworld pregen full).
  # The speed follows the tick time: halved above target-mspt, stopped above pause-mspt. Resumes after restarts.
  pregenerate:
    enabled: true
    levels: [P0, P1, P2, P3]
    spawn-radius: 384           # blocks around the spawn (P0)
    corridor-half-width: 2      # chunks either side of a route (P1/P4)
    area-radius: 128            # blocks around each area's heart (P3)
    max-in-flight: 12           # outstanding asynchronous chunk requests
    max-per-tick: 6             # new requests per tick
    target-mspt: 30
    pause-mspt: 45

# ---------------------------------------------------------------------------
# «Сүлдийн Атлас», the world map (docs/WORLD_MAP.md). Real blocks only: every generated chunk inside the border is
# read the way a vanilla map reads it and kept in plugins/SULD/map/columns (about 1 MB per 512 x 512 blocks); land
# never generated stays blank. The scan reads the world already on disk once (it starts by itself, throttled by the
# tick time like the pre-generator, and only new chunks after that). Staff: /suld map status|scan|export|refresh.
# ---------------------------------------------------------------------------
map:
  enabled: true
  # natural: grass, leaves and water take the colour of the biome they really stand in (as the game draws them);
  # vanilla: the colours of a vanilla map. Changing it makes the scan read the world again.
  colors: natural
  snapshot-budget-ms: 2.0       # main-thread time per tick for chunk snapshots
  workers: 2                    # threads that work out the colours and draw tiles
  max-regions: 32               # 512 x 512-block regions kept in memory (1 MB each)
  max-tiles: 512                # 128 x 128 map tiles kept in memory (16 KB each)
  max-diameter: 20000           # the map never covers more than this, whatever the border
  scan:
    auto-start: true
    auto-delay-seconds: 60
    max-in-flight: 8
    max-per-tick: 6
    target-mspt: 30
    pause-mspt: 45

# ---------------------------------------------------------------------------
# Skill tree (/skills). The node data lives in plugins/SULD/skills/*.json (copied from the jar on first start,
# validated on every start and on /skillsadmin reload; a broken class keeps its previous tree and the exact file and
# field are logged). Points come from levels, finished story chapters, discovered regions and admin grants.
# ---------------------------------------------------------------------------
skills:
  respec:
    cooldown-seconds: 300       # between two paid refunds
    orb-cooldown-seconds: 86400 # an Orb of Oblivion refunds for free, but only this long after the last respec (SP-3)
    coins-per-point: 25         # price per refunded point; free up to free-level
    free-level: 10
  builds:
    slots: 3                    # saved builds per player (/skills build save <name>)
  ultimate:
    resource-cost: 60           # class resource spent by the F ultimate (45 s cooldown)

# ---------------------------------------------------------------------------
# Shutdown. After the 15 s profile flush, this many seconds are shared by the style/clan/analytics flushes and the
# drain of every background pool. A pool still busy afterwards (a slow or dead database) is interrupted and the
# abandoned work is logged, so a stop never hangs into the server watchdog.
# ---------------------------------------------------------------------------
shutdown:
  budget-seconds: 20

# Cosmetics (/cosmetics). Shop cosmetics no rarer than coin-max-rarity can be bought with in-game coins (зоос) as well
# as credits; rarer ones (and every store-only one) need Сүлд Кредит. COMMON | RARE | EPIC | LEGENDARY.
cosmetics:
  coin-max-rarity: COMMON

# Anticheat (docs/ANTICHEAT.md). GrimAC runs as its own plugin and judges every player; SÜLD only tells it which
# movements SÜLD itself made: for a short window after a SÜLD dash/leap/dodge (40 ticks + two pings), while seated on
# the sky skill tree, a flag from one of exempt-checks is cancelled; the lock-on and horse lists below work the same
# way for their own windows. Movement checks only (and the two aim heuristics during lock-on):
# never list combat (Reach, Hitboxes, Interact, other Aim checks), packet (BadPackets*, PacketOrder*, Crash*, Timer) or world
# (FastBreak, Scaffold/place) checks. /suld grim shows what was forgiven; /suld grim reset clears the counts.
anticheat:
  grim:
    enabled: true
    exempt-checks: [Simulation, GroundSpoof, NoFall, Phase]
    # While lock-on turns the camera (Player#setRotation, 10 ticks): the server aims, so aim heuristics mean nothing.
    lock-on-exempt-checks: [AimModulo360, AimDuplicateLook]
    # 20 ticks after getting on or off a SÜLD horse (the vehicle appears or goes away under the rider).
    mount-exempt-checks: [Simulation, GroundSpoof, NoFall, VehicleA, VehicleB, VehicleC]
    # Forgiveness budget per player: at most budget-burst flags at once, then budget-per-second. An honest dash costs a
    # handful; a Fly/Speed client that keeps casting SÜLD movement to hide inside the windows runs dry in seconds.
    budget-burst: 60
    budget-per-second: 6

# The read-only armory API for a web page (docs/ARMORY_API.md): GET /api/player/{uuid}, /api/clans/leaderboard,
# /api/khuraldai/active, as JSON cached for cache-seconds. Off by default. Bind it to 127.0.0.1 and put a reverse proxy
# (TLS) in front of it; each client address gets a token bucket (burst, then per-minute). Nothing private is served.
web:
  armory:
    enabled: false
    bind: 127.0.0.1
    port: 8086
    cache-seconds: 30
    burst: 20
    per-minute: 60
    allow-origin: "*"
    # a reverse proxy on this host (e.g. "127.0.0.1"): its X-Forwarded-For names the client the rate limit counts
    trusted-proxies: []
