# ============================================================================
#  SULD — Mongolian Hardcore MMORPG  |  core configuration
#  Every gameplay value is data-driven. Edit here, then /suld reload (or restart)
# ============================================================================

# UI/message locale. "mn" = Mongolian (Cyrillic), "en" = English fallback.
# Schema version of this file (SULD migrates older files on start; do not edit).
config-version: 3
locale: mn

# ---------------------------------------------------------------------------
# Character progression (level / EXP curve).
# EXP to go from level L to L+1 = round(base * L^exponent).
# ---------------------------------------------------------------------------
progression:
  max-level: 60
  curve:
    base: 100.0
    exponent: 1.75

# ---------------------------------------------------------------------------
# Persistence. type: memory | mysql | postgresql
#   memory       -> no database, data is volatile (local dev / testing only)
#   mysql        -> requires a reachable MySQL/MariaDB server
#   postgresql   -> requires a reachable PostgreSQL server
# ---------------------------------------------------------------------------
database:
  type: memory
  host: 127.0.0.1
  port: 3306
  database: suld
  username: suld
  password: ''
  pool-size: 10
  connection-timeout-ms: 10000
  use-ssl: false

# ---------------------------------------------------------------------------
# Hardcore PvE death system. No real-money mechanics; recovery is free in-game
# or an admin action (/revive). All harshness levers are here.
# ---------------------------------------------------------------------------
death:
  enabled: true
  soul-state-seconds: 30
  exp-loss-fraction: 0.10
  durability-damage-fraction: 0.25
  drop-loot: true
  loot-loss-fraction: 0.5
  allow-free-revive: true

# ---------------------------------------------------------------------------
# Analytics. sink: log | database  (database requires a configured DB above)
# ---------------------------------------------------------------------------
analytics:
  enabled: true
  flush-interval-seconds: 30
  sink: log

# ---------------------------------------------------------------------------
# Resource pack (custom HUD, item skins). Sent automatically on join.
#   url empty  -> SÜLD serves the pack bundled in its own jar (self-host below);
#                 players download it from http://<the host they joined with>:<port>/
#   url set    -> that externally hosted ZIP is sent instead (deploy/build-pack.sh prints url + sha1)
# The self-host port must be reachable by players (deploy/firewall.sh opens PACK_PORT).
# ---------------------------------------------------------------------------
resource-pack:
  enabled: true
  url: ''
  sha1: ''
  # The SÜLD UI (badges, menu art, icons, weapon skins) lives in the pack, so it is required by default.
  required: true
  prompt: 'SÜLD-ийн дүрс багцыг татаж авна уу (Download the SÜLD resource pack)'
  self-host:
    enabled: true
    bind: 0.0.0.0
    port: 8164
    # e.g. http://play.example.mn:8164 when players join through a proxy or a different hostname
    public-url: ''

# ---------------------------------------------------------------------------
# Clans (овог). Founding costs in-game coins (a currency sink, never real money).
# ---------------------------------------------------------------------------
clans:
  create-cost: 500

# ---------------------------------------------------------------------------
# World events: server-wide timed objectives (e.g. Чонын Довтолгоо, the wolf
# raid). Admins can always force one with /suldevent start.
# ---------------------------------------------------------------------------
world-events:
  enabled: true
  interval-minutes: 45
  min-players: 1

# ---------------------------------------------------------------------------
# Authentication. SÜLD has NO /register or /login and never sees a password:
# identity comes only from Minecraft/Microsoft authentication (online-mode=true,
# or a Velocity proxy with modern forwarding). Players are identified by UUID.
# If the server is not verifying accounts, SÜLD refuses every login (fail closed).
# See docs/AUTHENTICATION.md.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Branding shown in the TAB list, sidebar and menus.
#   store-url: your web store (e.g. Tebex). The store delivers purchases by running
#   "credits give {uuid} <amount>" from the console. Credits buy cosmetics ONLY
#   (Minecraft EULA: no gameplay advantage for money).
# ---------------------------------------------------------------------------
# Daily login reward (/daily): one claim per calendar day in this time zone.
daily:
  timezone: Asia/Ulaanbaatar

branding:
  domain: suld.mn
  # Server-list MOTD: two MiniMessage lines (empty = the built-in SÜLD lines).
  motd: []
  # Show the bundled SÜLD icon in the server list (ignored when the server folder has its own server-icon.png).
  server-icon: true
  discord: ''
  store-url: ''

store:
  packages:
    - {credits: 100, price: '₮5,000'}
    - {credits: 250, price: '₮11,000'}
    - {credits: 600, price: '₮25,000'}
    - {credits: 1300, price: '₮50,000'}
    - {credits: 2800, price: '₮100,000'}

ui:
  # Show the welcome screen (tutorial / menu / play) when a returning player joins.
  welcome-screen: true

# Server owners: always operator (OP re-granted on every join). Only on a VERIFIED login
# (online-mode=true or Velocity modern forwarding); the account UUID is pinned in
# plugins/SULD/owners.yml on the owner's first verified join, so a later holder of the
# same name never gets OP. Entries are Minecraft names or account UUIDs.
owners:
  - qeevr_

auth:
  # LOCAL DEVELOPMENT ONLY — lets an offline-mode test server accept logins.
  # Anyone could join as anyone. NEVER enable on a public server.
  allow-insecure-offline-dev-mode: false
  profile-load-timeout-seconds: 10
  pending-session-ttl-seconds: 60

# ---------------------------------------------------------------------------
# World-unique relics (Хөх Сүлд, ...). Each exists ONCE on the whole server;
# the database is the only truth about who bears it. Shrines without a set
# location are built automatically on the surface at a random distance from
# spawn (admins can move them: /relic setshrine <key>).
# ---------------------------------------------------------------------------
relics:
  enabled: true
  auto-place-min-radius: 600
  auto-place-max-radius: 1200
  offline-return-hours: 72
  ritual-seconds: 10
  hint-cooldown-seconds: 300

# ---------------------------------------------------------------------------
# World: Kharkhorum spawn city. With kharkhorum-auto-build the WorldBuilder builds
# slice 1 once on first boot at the world spawn (resumable across restarts; state,
# height map and rollback log in plugins/SULD/worldbuild/) and moves the spawn onto
# the plaza. Operate it with /worldbuild (status, validate, rollback confirm, ...).
# build-blocks-per-tick caps writes per tick (a 25 ms time budget applies too).
# region-spawning / region-mobs-per-player: reserved, not wired yet.
# ---------------------------------------------------------------------------
world:
  kharkhorum-auto-build: true
  build-blocks-per-tick: 4000
  region-spawning: true
  region-mobs-per-player: 4
  # Pre-generate the overworld around Kharkhorum with Chunky (core plugin profile) once the city is
  # built, so exploring never waits on chunk generation. Resumes after restarts. /chunky progress
  pregenerate:
    enabled: true
    radius: 2000
