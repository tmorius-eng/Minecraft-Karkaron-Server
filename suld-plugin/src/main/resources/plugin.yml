name: SULD
version: '${version}'
main: mn.suld.plugin.SuldPlugin
api-version: '${apiVersion}'
description: SULD — Mongolian Hardcore MMORPG core.
authors: [SULD Team]
website: https://github.com/tmorius-eng/Minecraft-Karkaron-Server
# SULD owns the RPG commands (/help, /rules, /spawn, /class, /skills, ...): load before the utility
# plugins so their same-named commands defer to SULD.
loadbefore: [Essentials, EssentialsSpawn, CMI]
softdepend: [LuckPerms, PlaceholderAPI, Chunky]
# Infrastructure-only runtime libraries, fetched by Paper from Maven Central on
# first load. Pinned. HikariCP is shaded into the jar, not listed here. Only the
# driver matching the configured database is actually used at runtime.
libraries:
  - com.mysql:mysql-connector-j:9.1.0
  - org.postgresql:postgresql:42.7.4
commands:
  suld:
    description: SULD player/admin command (info, profile; admin spawnmob, exp, quest, auth).
    usage: /suld <info|profile|spawnmob>
  revive:
    description: Revive a player from the hardcore death lock (admin; same as /deathrevive).
    usage: /revive <player>
    permission: suld.admin.death.revive
  deathstatus:
    description: Death lock, time left, wound and the last deaths of a player (admin).
    usage: /deathstatus <player>
    permission: suld.admin.death
  deathinfo:
    description: One recorded death of a player in full (admin).
    usage: /deathinfo <player> [death#]
    permission: suld.admin.death
  deathrevive:
    description: End a player's death lock now; the wound still applies (admin, audited).
    usage: /deathrevive <player>
    permission: suld.admin.death.revive
  deathreset:
    description: End a player's death lock and clear the wound (admin, audited; staff errors only).
    usage: /deathreset <player>
    permission: suld.admin.death.reset
  suldpack:
    description: SULD resource-pack control (status, reload, force).
    usage: /suldpack <status|reload|force>
  party:
    description: SULD party control (invite, accept, leave, kick, promote, disband, info).
    usage: /party <invite|accept|leave|kick|promote|disband|info>
    aliases: [p]
  dungeon:
    description: SULD dungeons (list, enter, status, leave, abort).
    usage: /dungeon <list|enter|status|leave|abort>
    aliases: [agui]
  clan:
    description: SULD clans (create, invite, accept, leave, kick, promote, demote, transfer, disband, info, top, chat).
    usage: /clan <create|invite|accept|leave|kick|promote|demote|transfer|disband|info|top|chat>
    aliases: [ovog, clans]
  cc:
    description: Clan chat.
    usage: /cc <message>
  suldevent:
    description: SULD world events (status; admin start/stop).
    usage: /suldevent <status|start|stop>
  relic:
    description: World-unique relics (list, info, hint, history; admin setshrine/return/give/recover/tp).
    usage: /relic <list|info|hint|history>
    aliases: [suld-unique, suldee]
  help:
    description: SULD player guide (pages start, class, city, dungeon, clan, relic, commands, rules).
    usage: /help [page]
    aliases: ['?', tuslamj, zaavar]
  rules:
    description: Server rules.
    usage: /rules
    aliases: [juram]
  spawn:
    description: Return to Kharkhorum (3 s warm-up outside the city).
    usage: /spawn
    aliases: [hot]
  balance:
    description: Your SULD coins.
    usage: /balance
    aliases: [bal, money, zoos]
  pay:
    description: Send SULD coins to an online player.
    usage: /pay <player> <amount>
    aliases: [tuluh]
  class:
    description: Choose your class (first time) or view it.
    usage: /class
    aliases: [angi]
  profile:
    description: Your character sheet.
    usage: /profile
    aliases: [stats, dur]
  exp:
    description: Level and EXP progress.
    usage: /exp
    aliases: [level, lvl, tuvshin]
  quest:
    description: The storyline board «Сүлдний Зам» (/quest info prints the active chapter).
    usage: /quest
    aliases: [quests, erel]
  menu:
    description: The SULD main menu (also the clock in hotbar slot 9).
    usage: /menu
    aliases: [tses, цэс]
  tutorial:
    description: Step-by-step guide for new players.
    usage: /tutorial
    aliases: [zaavar2, guide]
  cosmetics:
    description: Tags, name colours, chat colours, join messages, emojis.
    usage: /cosmetics
    aliases: [goyol, cosmetic]
  shop:
    description: Supplies, sell loot, cosmetics.
    usage: /shop
    aliases: [zakh, delguur]
  buy:
    description: The credit store (SULD credits buy cosmetics only).
    usage: /buy
    aliases: [store]
  rankup:
    description: Climb the rank ladder (Ard to Khaan).
    usage: /rankup
    aliases: [rank, tsol]
  lvlup:
    description: Claim your level rewards.
    usage: /lvlup
    aliases: [levelrewards, shagnal]
  skills:
    description: Your skill tree map (points, passive and active skills), spells, builds, respec, search.
    usage: /skills [tree|info|spells|reset [branch]|build save|load|delete|list <name>|search <text>]
    aliases: [tree, spells, ur, chadvar]
    permission: suld.skills
  skill:
    description: Inspect, unlock or refund one skill node (/skill <node> [unlock|refund|info|open]).
    usage: /skill <node> [unlock|refund|info|open]
    permission: suld.skills
  skillsadmin:
    description: Skill-tree administration (inspect, grantpoints, unlock, reset, orb, reload, validate).
    usage: /skillsadmin <inspect|grantpoints|unlock|reset|orb|reload|validate> ...
    aliases: [sadmin]
    permission: suld.admin.skills
  item:
    description: The SULD item in your hand (inspect, compare, equip, unequip, sell, destroy, bind, salvage, recipes, craft).
    usage: /item <inspect|compare|equip [slot]|unequip <slot>|sell|destroy|bind|salvage [confirm]|recipes|craft <recipe>>
    aliases: [ed]
    permission: suld.items
  items:
    description: Every SULD item you carry, compared with what you wear; click to equip.
    usage: /items
    aliases: [edzuils]
    permission: suld.items
  equipment:
    description: Your nine equipment slots, item stats, set progress and gear score.
    usage: /equipment
    aliases: [gear, khuyag]
    permission: suld.items
  loot:
    description: What a loot table can drop (/loot [table]).
    usage: /loot [table]
    aliases: [olz]
    permission: suld.items
  itemsadmin:
    description: Item administration (inspect, give, roll, validate, reload, sweep, quarantine).
    usage: /itemsadmin <inspect|give|roll|validate|reload|sweep|quarantine> ...
    aliases: [iadmin]
    permission: suld.admin.items
  suldperf:
    description: Performance measurement sessions and item-engine benchmarks (start, stop, bench, report).
    usage: /suldperf <start <label>|stop|bench [n]|report>
    permission: suld.admin.perf
  credits:
    description: Your SULD credits; admin/console give|take.
    usage: /credits [give|take <player|uuid> <amount>]
    aliases: [kredit]
  commands:
    description: Every command you may use, grouped, with what it does.
    aliases: [cmds, komand, komandu]
  discord:
    description: The server Discord link.
  website:
    description: The server website.
    aliases: [site, web]
  vote:
    description: Vote for the server (link from branding.vote-url).
  trade:
    description: Trade items and coins with a nearby player (both confirm).
    aliases: [arilj, arilzhaa]
  top:
    description: Server leaderboards (level, coins).
    aliases: [shildeg, leaderboard, baltop]
  mori:
    description: Summon (or send away) your personal steppe horse — from level 5, faster with rank.
    aliases: [horse, mount]
  tasks:
    description: Three daily hunting tasks (coins and EXP).
    aliases: [daalgavar, bounty, bounties]
  daily:
    description: The daily login reward (7-day streak; coins and EXP).
    aliases: [odor, bonus]
  worldbuild:
    description: WorldBuilder (status, build, pause, resume, validate, dump, rollback, approve, lock, unlock, tp).
    usage: /worldbuild <status|build|pause|resume|validate|dump|rollback|approve|lock|unlock|tp>
    aliases: [wbuild]
    permission: suld.admin.world
permissions:
  suld.badge.owner:
    description: Badge ЭЗЭН (server owner). Given automatically to the owners in config.yml.
    default: false
  suld.badge.admin:
    description: Badge АДМИН.
    default: false
  suld.badge.developer:
    description: Badge DEV.
    default: false
  suld.badge.mod:
    description: Badge МОД (moderator).
    default: false
  suld.badge.helper:
    description: Badge ТУСЛАГЧ (helper).
    default: false
  suld.badge.streamer:
    description: Badge СТРИМЕР.
    default: false
  suld.badge.sponsor:
    description: Badge ДЭМЖИГЧ (sponsor).
    default: false
  suld.chat.bypass:
    description: Not limited by the chat guard (rate limit, repeats, links, caps).
    default: op
  suld.admin.credits:
    description: Give or take store credits (/credits); the store runs it from the console.
    default: op
  suld.admin:
    description: Grants all SULD administrative commands.
    default: op
    children:
      suld.admin.revive: true
      suld.admin.death: true
      suld.admin.death.revive: true
      suld.admin.death.reset: true
      suld.admin.pack: true
      suld.admin.event: true
      suld.admin.relic: true
      suld.admin.world: true
      suld.admin.credits: true
      suld.admin.skills: true
      suld.admin.items: true
      suld.admin.perf: true
  suld.skills:
    description: Use the skill tree (/skills, /skill).
    default: true
  suld.admin.perf:
    description: Performance measurement (/suldperf) - tick, CPU, memory, entity sampling and code-path timings.
    default: op
  suld.items:
    description: Use SULD items (/item, /items, /equipment, /loot).
    default: true
  suld.admin.items:
    description: Item administration (/itemsadmin) - inspect, give, roll loot, validate/reload item data, duplicate sweep, quarantine.
    default: op
  suld.admin.skills:
    description: Skill-tree administration (/skillsadmin) - inspect, grant points, force-unlock, reset, reload data files.
    default: op
  suld.admin.world:
    description: Operate the WorldBuilder (build, rollback, approve, lock the city).
    default: op
  suld.admin.revive:
    description: Allows reviving players from the death lock (legacy name; grants suld.admin.death.revive).
    default: op
    children:
      suld.admin.death.revive: true
      suld.admin.death: true
  suld.admin.death:
    description: View death locks, wounds and death history.
    default: op
  suld.admin.death.revive:
    description: End a player's death lock (audited).
    default: op
  suld.admin.death.reset:
    description: Clear a player's death lock and wound (audited).
    default: op
  suld.admin.pack:
    description: Allows resource-pack admin actions.
    default: op
  suld.admin.event:
    description: Allows starting/stopping world events.
    default: op
  suld.admin.relic:
    description: Relic administration (setshrine, return, give, recover, tp) and shrine block edits.
    default: op
